<div class="dashboard">

    <header class="dashboard-header p1-header">
  <img class="p1-logo" src="img/LOGO_TREN_MAYA_.png" alt="Emblema dorado del Tren Maya" width="92" height="116">

    <p class="p1-modulo">INCIDENCIAS</p>
  </div>
  <time id="fechaActual" class="fecha-dashboard p1-fecha" aria-label="Fecha actual en Ciudad de México"></time>

    <!-- BARRA DE PESTAÑAS (IGUAL A LA DE INDEX / OPERACIONES) -->

        <a href="costos.html">Costos</a>
    </nav>

    <!-- CONTENIDO -->
    <main class="dashboard-grid incidencias-layout">

        <!-- FORMULARIO -->
        <section class="dashboard-card">
            <div class="card-header">
                <h2>⚠️ Registrar incidencia</h2>
            </div>

            <div class="formulario">
                <label>Programación</label>
                <select id="programacion_id">
                    <option value="">Selecciona una programación</option>
                </select>

                <label>Fecha y hora</label>
                <input type="datetime-local" id="fecha">

                <div class="form-group">
                    <label for="tipo">Tipo de Incidencia *</label>
                    <select id="tipo" name="tipo" class="form-control" required>
                        <option value="">Selecciona un tipo</option>
                        <option value="Falla mecánica">Falla mecánica</option>
                        <option value="Falla eléctrica">Falla eléctrica</option>
                        <option value="Accidente">Accidente</option>
                        <option value="Operativa">Operativa</option>
                        <option value="Clima">Clima</option>
                        <option value="Otra">Otra</option>
                    </select>

                    <label>Descripción</label>
                    <select id="descripcion">
                        <option value="">Selecciona primero el tipo de incidencia</option>
                    </select>

                    <label>Minutos de demora</label>
                    <input type="number" id="minutos_demora" min="0" value="0">

                    <label>Locomotora</label>
                    <input type="text" id="locomotora" placeholder="Número de locomotora">

                    <label>Responsable</label>
                    <input type="text" id="responsable" placeholder="Nombre del responsable">

                    <label>Observaciones</label>
                    <textarea id="observaciones" placeholder="Observaciones adicionales..."></textarea>

                    <div class="botones">
                        <button id="btnGuardarIncidencia">💾 GUARDAR</button>
                        <button id="btnLimpiarIncidencia">LIMPIAR</button>
                    </div>

                    <div id="mensajeIncidencia"></div>
                </div>
            </div>
        </section>

        <!-- LISTADO -->
        <section class="dashboard-card">
            <div class="card-header">
                <h2>Historial de Incidencias</h2>
                
                <div style="display: flex; gap: 10px;">
            <button onclick="exportarTablaAExcel('tablaIncidencias', 'reporte_incidencias.xlsx')" class="btn btn-success btn-sm" style="background-color: #16a34a; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer;">
                📥 Exportar a Excel
            </button>
            <button type="button" id="exportarPDF" disabled
    style="background:#ee7975; color:white; border:0;
           border-radius:6px; padding:6px 12px; cursor:pointer;">
    Exportar a PDF
</button>

<label for="periodoHistorial">Periodo</label>
<select id="periodoHistorial">
    <option value="todo">Todos</option>
    <option value="hoy">Hoy</option>
    <option value="semana">Esta semana</option>
    <option value="mes">Este mes</option>
    <option value="ano">Este año</option>
</select>
                
                <button id="btnActualizarIncidencias">🔄 Actualizar</button>
              
            </div>
            </div>

            <div class="tabla-contenedor">
                <div class="p1-tabla-scroll" tabindex="0" role="region" aria-label="Tabla desplazable"><table id="tablaIncidencias"> <!-- Asegúrate de que tu tabla tenga este ID exacto -->
                    <thead>
                        <tr>
                            <th>Fecha y hora</th>
                            <th>Tren</th>
                            <th>Tipo</th>
                            <th>Descripción</th>
                            <th>Demora</th>
                            <th>Locomotora</th>
                            <th>Responsable</th>
                            <th>Observaciones</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpoTablaIncidencias">
                    </tbody>
                </table></div>
            </div>

            <div id="mensajeIncidencias"></div>
        </section>

    </main>

</div>
